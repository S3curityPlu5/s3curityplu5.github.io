<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mixcloud Sessions – MezMediciMedia</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: #050505;
      color: #eaffff;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    .neon-grid {
      background:
        linear-gradient(90deg, rgba(0,255,225,0.08) 1px, transparent 1px),
        linear-gradient(rgba(0,255,225,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      padding: 40px;
    }

    h1, h2 {
      text-transform: uppercase;
      background: linear-gradient(90deg, #00ffe1, #0088ff, #00ffe1);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      color: transparent;
      animation: headerGlow 6s infinite linear;
      margin-bottom: 20px;
    }

    @keyframes headerGlow {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 0%; }
      100% { background-position: 0% 0%; }
    }

    .neon-box {
      border: 2px solid #00ffe1;
      box-shadow: 0 0 12px #00ffe1, inset 0 0 12px #00ffe1;
      padding: 20px;
      margin-bottom: 40px;
      animation: neonPulse 3s infinite ease-in-out;
    }

    @keyframes neonPulse {
      0% { box-shadow: 0 0 8px #00ffe1, inset 0 0 4px #00ffe1; }
      50% { box-shadow: 0 0 20px #00ffe1, inset 0 0 10px #00ffe1; }
      100% { box-shadow: 0 0 8px #00ffe1, inset 0 0 4px #00ffe1; }
    }

    iframe {
      width: 100%;
      height: 400px;
      border: none;
      box-shadow: 0 0 15px #00ffe1;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #00ffe1;
    }
  </style>
</head>

<body>

<div class="neon-grid">

  <header class="neon-box">
    <h1>Mixcloud Sessions</h1>
    <p>Live mixes, B2B sets, and curated progressive house sessions</p>
  </header>

  <main>

    <section class="neon-box">
      <h2>Featured Mix</h2>

      <iframe 
        src="https://player-widget.mixcloud.com/widget/iframe/?feed=%2Fanthonypappa%2Fquivver-anthony-pappa-b2b-controlled-substance-40%2F&utm_medium=share&utm_source=embed&utm_content=show&utm_term=VXNlcjozMDQ1MjA4"
        allow="encrypted-media; fullscreen; autoplay; idle-detection; speaker-selection; web-share;">
      </iframe>
    </section>

    <section class="neon-box">
      <h2>More Sessions</h2>

      <!-- Duplicate this block for more Mixcloud embeds -->
      <iframe 
        src="https://player-widget.mixcloud.com/widget/iframe/?feed=%2Fanthonypappa%2Fquivver-anthony-pappa-b2b-controlled-substance-40%2F"
        allow="encrypted-media; fullscreen; autoplay; idle-detection; speaker-selection; web-share;">
      </iframe>

    </section>

    <section class="neon-box">
      <p><a href="index.html" style="color:#00ffe1;">Return to Home</a></p>
    </section>

  </main>

</div>

<footer>
  <p>&copy; 2026 MezMediciMedia. All rights reserved.</p>
</footer>

</body>
</html>
